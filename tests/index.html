<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WellBe Quest — Unit Tests</title>
  <style>
    body { font-family: monospace; background: #f5f5f5; margin: 0; padding: 24px; color: #17211d; }
    h1 { font-size: 1.2rem; margin: 0 0 20px; color: #1a1a2e; }
    .suite { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; border: 1px solid #e0e0e0; }
    .suite h2 { font-size: .95rem; margin: 0 0 10px; color: #444; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .test { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: .88rem; }
    .pass { color: #166534; }
    .fail { color: #991b1b; }
    .icon { flex-shrink: 0; font-weight: bold; }
    .detail { color: #666; font-size: .8rem; margin-left: 16px; }
    #summary { font-size: 1rem; font-weight: bold; padding: 12px 20px; border-radius: 8px; margin-top: 8px; }
    #summary.all-pass { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    #summary.has-fail  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <h1>WellBe Quest — Unit Tests</h1>
  <div id="output"></div>
  <div id="summary"></div>

  <script src="unit/test-runner.js"></script>
  <script src="unit/wellbe-logic.fixture.js"></script>
  <script src="unit/progress.spec.js"></script>
  <script src="unit/security.spec.js"></script>
  <script>
    WellbeUnit.renderResults({
      output: document.querySelector("#output"),
      summary: document.querySelector("#summary")
    });
  </script>
</body>
</html>
